<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070709" />
    <title>세 개의 방</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script id="static-fallback">
      window.addEventListener(
        "error",
        function (e) {
          var t = e && e.target;
          if (!t || t.tagName !== "SCRIPT") return;
          if (String(t.src || "").indexOf("main.tsx") === -1) return;
          var next = new URL("docs/", location.href);
          next.hash = location.hash;
          location.replace(next.href);
        },
        true,
      );
    </script>
  </body>
</html>
